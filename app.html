<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upkeep - your house remembers nothing</title>
<style>
  :root { --bg:#101614; --panel:#16211e; --line:#28413a; --text:#eef5f1; --dim:#8fa89e; --accent:#5fd4a4; --over:#ff8f7a; --soon:#ffcf7a; --ok:#8be0a4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(640px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#0c120f; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#101614; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .gauge { display:flex; align-items:center; gap:16px; }
  .gnum { font-size:44px; font-weight:900; }
  .gbar { flex:1; height:10px; background:#0c120f; border-radius:5px; overflow:hidden; border:1px solid var(--line); }
  .gbar i { display:block; height:100%; background:var(--accent); }
  .glabel { color:var(--dim); font-size:12px; margin-top:4px; }
  .task { background:#0c120f; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; display:flex; align-items:center; gap:12px; }
  .task .info { flex:1; }
  .task .nm { font-weight:700; font-size:14px; }
  .task .meta { color:var(--dim); font-size:12px; margin-top:3px; }
  .task .meta b { color:var(--text); font-weight:600; }
  .chip { font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; white-space:nowrap; }
  .c-overdue { background:var(--over); color:#101614; }
  .c-due-soon { background:var(--soon); color:#101614; }
  .c-ok { background:#1e4d3a; color:var(--ok); }
  .c-never { background:#3a3f3a; color:var(--dim); }
  .done-btn { background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .done-btn:hover { background:var(--accent); color:#101614; }
  .del { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; padding:4px; }
  .del:hover { color:var(--over); }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>Upkeep</h1>
<div class="sub">your house remembers nothing. every filter, battery and gutter runs on a clock you can't hear.</div>

<div class="card">
  <h2>Home health</h2>
  <div class="gauge">
    <div><div class="gnum" id="health">100</div><div class="glabel">out of 100</div></div>
    <div class="gbar"><i id="healthbar" style="width:100%"></i></div>
  </div>
</div>

<div class="card">
  <h2>Add a task</h2>
  <div class="row">
    <div><label>Task</label><input id="t-name" placeholder="e.g. Clean dryer vent"></div>
    <div><label>Every</label><select id="t-interval"><option value="30">30 days</option><option value="60">60 days</option><option value="90" selected>90 days</option><option value="180">6 months</option><option value="365">yearly</option></select></div>
    <div><label>Last done</label><input id="t-date" type="date"></div>
    <button id="add">Add</button>
  </div>
</div>

<div class="card">
  <h2>Your upkeep</h2>
  <div id="tasks"></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'upkeep-v1';
  var tasks = null;
  var DEFAULTS = [
    { id: 'd1', name: 'HVAC filter', intervalDays: 90, lastDone: null },
    { id: 'd2', name: 'Smoke detector batteries', intervalDays: 365, lastDone: null },
    { id: 'd3', name: 'Clean gutters', intervalDays: 180, lastDone: null },
    { id: 'd4', name: 'Flush water heater', intervalDays: 365, lastDone: null },
    { id: 'd5', name: 'Vacuum fridge coils', intervalDays: 180, lastDone: null }
  ];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) tasks = s; } catch (e) {}
    if (!tasks) tasks = DEFAULTS.slice();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fmt(until) {
    if (until === null) return '';
    if (until < 0) return (-until) + 'd overdue';
    if (until === 0) return 'due today';
    return 'due in ' + until + 'd';
  }
  var LABEL = { overdue: 'overdue', 'due-soon': 'due soon', ok: 'on track', never: 'never done' };

  function render() {
    var now = todayISO();
    var h = Upkeep.health(tasks, now);
    document.getElementById('health').textContent = h;
    var bar = document.getElementById('healthbar');
    bar.style.width = h + '%';
    bar.style.background = h >= 80 ? 'var(--ok)' : h >= 50 ? 'var(--soon)' : 'var(--over)';

    var el = document.getElementById('tasks');
    if (!tasks.length) { el.innerHTML = '<div class="empty">No tasks. Add one above.</div>'; return; }
    el.innerHTML = '';
    Upkeep.sortTasks(tasks, now).forEach(function (s) {
      var t = s.task;
      var div = document.createElement('div');
      div.className = 'task';
      var meta = s.due
        ? 'every ' + t.intervalDays + 'd &middot; last done <b>' + t.lastDone + '</b> &middot; next due <b>' + s.due + '</b> (' + fmt(s.daysUntil) + ')'
        : 'every ' + t.intervalDays + 'd &middot; never logged - mark it done to start the clock';
      div.innerHTML = '<span class="chip c-' + s.tier + '">' + LABEL[s.tier] + '</span>' +
        '<span class="info"><span class="nm">' + esc(t.name) + '</span><div class="meta">' + meta + '</div></span>' +
        '<button class="done-btn" data-id="' + t.id + '">did it</button>' +
        '<button class="del" data-id="' + t.id + '">&times;</button>';
      el.appendChild(div);
    });
    el.querySelectorAll('.done-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        tasks.forEach(function (t) { if (t.id === b.getAttribute('data-id')) t.lastDone = todayISO(); });
        save(); render();
      });
    });
    el.querySelectorAll('.del').forEach(function (b) {
      b.addEventListener('click', function () {
        tasks = tasks.filter(function (t) { return t.id !== b.getAttribute('data-id'); });
        save(); render();
      });
    });
  }

  document.getElementById('add').addEventListener('click', function () {
    var name = document.getElementById('t-name').value.trim();
    var date = document.getElementById('t-date').value;
    if (!name) return;
    tasks.push({ id: 't' + Date.now(), name: name, intervalDays: +document.getElementById('t-interval').value, lastDone: date || null });
    document.getElementById('t-name').value = '';
    document.getElementById('t-date').value = '';
    save(); render();
  });

  // test hook
  window.__up = {
    clear: function () { tasks = []; save(); render(); },
    add: function (name, intervalDays, lastDone) {
      tasks.push({ id: 't' + Math.random(), name: name, intervalDays: intervalDays, lastDone: lastDone });
      save(); render();
    },
    read: function () {
      return {
        names: Array.prototype.map.call(document.querySelectorAll('#tasks .nm'), function (d) { return d.textContent; }),
        chips: Array.prototype.map.call(document.querySelectorAll('#tasks .chip'), function (d) { return d.textContent; }),
        metas: Array.prototype.map.call(document.querySelectorAll('#tasks .meta'), function (d) { return d.textContent; }),
        health: document.getElementById('health').textContent
      };
    }
  };

  load();
  render();
})();
</script>
</body>
</html>
